name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proposed revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Scan secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/security/scan_secrets.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.15.0"

      - name: Audit production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=info

      - name: Audit all mobile dependencies
        run: npm audit --package-lock-only --include=dev --audit-level=high

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: fitmap_test
          POSTGRES_USER: fitmap_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fitmap_test -d fitmap_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.6"

      - name: Audit production dependencies
        run: uv audit --locked --no-dev --python-version 3.13 --python-platform linux --no-python-downloads

      - name: Audit all backend dependencies
        run: uv audit --locked --python-version 3.13 --python-platform linux --no-python-downloads

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff lint
        run: uv run ruff check src tests alembic

      - name: Check Ruff formatting
        run: uv run ruff format --check src tests alembic

      - name: Run Pyright
        run: uv run pyright

      - name: Validate database migrations
        shell: bash
        env:
          FITMAP_ENVIRONMENT: test
          FITMAP_DB_HOST: 127.0.0.1
          FITMAP_DB_PORT: "5434"
          FITMAP_DB_NAME: fitmap_test
          FITMAP_DB_USER: fitmap_test
        run: |
          FITMAP_DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$FITMAP_DB_PASSWORD"
          export FITMAP_DB_PASSWORD
          FITMAP_AUTH_JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          FITMAP_AUTH_RATE_LIMIT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$FITMAP_AUTH_JWT_SECRET"
          echo "::add-mask::$FITMAP_AUTH_RATE_LIMIT_SECRET"
          export FITMAP_AUTH_JWT_SECRET FITMAP_AUTH_RATE_LIMIT_SECRET

          uv run --frozen alembic upgrade head
          PGOPTIONS="-c default_transaction_read_only=on" uv run --frozen alembic check

      - name: Run tests
        run: uv run pytest

  backend-container:
    name: Backend container validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag fitmap-backend:${{ github.sha }} ./backend

      - name: Validate container security baseline
        run: |
          test "$(docker run --rm fitmap-backend:${{ github.sha }} id -u)" != "0"
          docker run --rm fitmap-backend:${{ github.sha }} sh -c "test ! -f /app/.env"

      - name: Start isolated backend and PostgreSQL
        shell: bash
        run: |
          FITMAP_DB_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          FITMAP_AUTH_JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          FITMAP_AUTH_RATE_LIMIT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$FITMAP_DB_PASSWORD"
          echo "::add-mask::$FITMAP_AUTH_JWT_SECRET"
          echo "::add-mask::$FITMAP_AUTH_RATE_LIMIT_SECRET"
          export FITMAP_DB_PASSWORD FITMAP_AUTH_JWT_SECRET FITMAP_AUTH_RATE_LIMIT_SECRET
          export POSTGRES_PASSWORD="$FITMAP_DB_PASSWORD"

          docker network create fitmap-ci-network

          docker run \
            --detach \
            --name fitmap-postgres-ci \
            --network fitmap-ci-network \
            --env POSTGRES_DB=fitmap_test \
            --env POSTGRES_USER=fitmap_test \
            --env POSTGRES_PASSWORD \
            --tmpfs /var/lib/postgresql \
            postgres:18-alpine

          docker run \
            --detach \
            --name fitmap-backend-ci \
            --network fitmap-ci-network \
            --env FITMAP_ENVIRONMENT=production \
            --env FITMAP_DB_HOST=fitmap-postgres-ci \
            --env FITMAP_DB_PORT=5432 \
            --env FITMAP_DB_NAME=fitmap_test \
            --env FITMAP_DB_USER=fitmap_test \
            --env FITMAP_DB_PASSWORD \
            --env FITMAP_AUTH_JWT_SECRET \
            --env FITMAP_AUTH_RATE_LIMIT_SECRET \
            --publish 127.0.0.1:8000:8000 \
            fitmap-backend:${{ github.sha }}

      - name: Validate backend health and readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import subprocess
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import ProxyHandler, build_opener

          opener = build_opener(ProxyHandler({}))
          base = "http://127.0.0.1:8000"

          health = (200, {"status": "ok"})
          ready = (200, {"status": "ready"})
          unavailable = (
              503,
              {"error": {
                  "code": "database_unavailable",
                  "message": "Database is unavailable.",
              }},
          )

          def request(path):
              try:
                  with opener.open(base + path, timeout=6) as response:
                      return response.status, json.load(response)
              except HTTPError as exc:
                  return exc.code, json.load(exc)
              except (URLError, OSError, http.client.HTTPException):
                  return None

          def wait_for(label, predicate):
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  state = subprocess.check_output(
                      ["docker", "inspect", "--format",
                       "{{.State.Running}}", "fitmap-backend-ci"],
                      text=True,
                  ).strip()
                  if state != "true":
                      raise RuntimeError("Backend container exited.")
                  if predicate():
                      print(f"{label}: passed", flush=True)
                      return
                  time.sleep(1)
              raise RuntimeError(f"{label}: timeout")

          def database_ready():
              return subprocess.run(
                  ["docker", "exec", "fitmap-postgres-ci",
                   "pg_isready", "-h", "127.0.0.1",
                   "-U", "fitmap_test", "-d", "fitmap_test"],
                  capture_output=True,
              ).returncode == 0

          wait_for("PostgreSQL startup", database_ready)
          wait_for("Health HTTP 200", lambda: request("/health") == health)
          wait_for("Readiness HTTP 200", lambda: request("/ready") == ready)

          subprocess.run(
              ["docker", "stop", "fitmap-postgres-ci"],
              check=True,
          )

          wait_for("Readiness HTTP 503",
                   lambda: request("/ready") == unavailable)

          assert request("/health") == health
          print("Health remains HTTP 200 during database outage.")

          subprocess.run(
              ["docker", "start", "fitmap-postgres-ci"],
              check=True,
          )

          wait_for("PostgreSQL recovery", database_ready)
          wait_for("Readiness recovered HTTP 200",
                   lambda: request("/ready") == ready)

          assert request("/health") == health
          print("All readiness scenarios passed.")
          PY

      - name: Collect container diagnostics
        if: failure()
        run: |
          docker logs --tail 50 fitmap-backend-ci || true
          docker logs --tail 50 fitmap-postgres-ci || true

      - name: Clean up isolated containers
        if: always()
        shell: bash
        run: |
          for name in fitmap-backend-ci fitmap-postgres-ci; do
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker rm --force --volumes "$name"
            fi
          done

          if docker network inspect fitmap-ci-network >/dev/null 2>&1; then
            docker network rm fitmap-ci-network
          fi
