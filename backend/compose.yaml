services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${FITMAP_DB_NAME}
      POSTGRES_USER: ${FITMAP_DB_USER}
      POSTGRES_PASSWORD: ${FITMAP_DB_PASSWORD}

    ports:
      - "${FITMAP_DB_PORT}:5432"

    volumes:
      - fitmap_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  s3mock:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped

    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${FITMAP_MEDIA_BUCKET_NAME:-fitmap-private-media}
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${FITMAP_MEDIA_REGION_NAME:-us-east-1}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"

    ports:
      - "${FITMAP_MEDIA_PORT:-9090}:9090"

    volumes:
      - fitmap_s3mock_data:/s3mockroot

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: fitmap-backend:${FITMAP_IMAGE_TAG:-local}
    restart: unless-stopped

    env_file:
      - .env

    environment:
      FITMAP_DB_HOST: postgres
      FITMAP_DB_PORT: 5432
      FITMAP_MEDIA_BUCKET_NAME: ${FITMAP_MEDIA_BUCKET_NAME:-fitmap-private-media}
      FITMAP_MEDIA_REGION_NAME: ${FITMAP_MEDIA_REGION_NAME:-us-east-1}
      FITMAP_MEDIA_ENDPOINT_URL: http://s3mock:9090
      FITMAP_MEDIA_ACCESS_KEY_ID: ${FITMAP_MEDIA_ACCESS_KEY_ID:-test}
      FITMAP_MEDIA_SECRET_ACCESS_KEY: ${FITMAP_MEDIA_SECRET_ACCESS_KEY:-test}

    ports:
      - "${FITMAP_API_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  fitmap_postgres_data:
  fitmap_s3mock_data: