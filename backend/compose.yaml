services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${FITMAP_DB_NAME}
      POSTGRES_USER: ${FITMAP_DB_USER}
      POSTGRES_PASSWORD: ${FITMAP_DB_PASSWORD}

    ports:
      - "${FITMAP_DB_PORT}:5432"

    volumes:
      - fitmap_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  fitmap_postgres_data: