[project]
name = "fitmap-backend"
version = "0.1.0"
description = "Backend API for the FitMap mobile fitness platform."
readme = "README.md"
authors = [
    { name = "Gustavo Mautoni", email = "gustavomautoni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fitmap"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
