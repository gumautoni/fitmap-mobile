services:
  postgres-test:
    image: postgres:18-alpine
    restart: "no"

    environment:
      POSTGRES_DB: fitmap_test
      POSTGRES_USER: fitmap_test
      POSTGRES_PASSWORD: fitmap_test_password

    ports:
      - "5434:5432"

    tmpfs:
      - /var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmap_test -d fitmap_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s